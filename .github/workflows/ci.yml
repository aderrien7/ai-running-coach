name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          FLASK_SECRET_KEY: ci_test_secret_key_not_real
          STRAVA_CLIENT_ID: ci_test_id
          STRAVA_CLIENT_SECRET: ci_test_secret
          ANTHROPIC_API_KEY: ci_test_anthropic_key
          LLM_BACKEND: claude
